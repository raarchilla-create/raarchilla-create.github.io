<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283f"><title>Hospitality OS</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#152c3f;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#10283f;color:white;padding:18px 18px 14px;position:sticky;top:0;z-index:5}header strong{font-size:21px}header small{display:block;color:#b8d4dc}main{max-width:900px;margin:auto;padding:16px 14px 110px}.card{background:white;border:1px solid #dce5ea;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #1232 4%}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:10px 0}p{color:#627789;line-height:1.45}label{font-size:13px;font-weight:650;display:block;margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd9df;border-radius:10px;padding:12px;font:inherit;background:white;color:#183449}textarea{min-height:75px}button{border:0;background:#087f85;color:white;border-radius:11px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;min-height:44px}button.secondary{background:#e9f1f4;color:#173c50}button.danger{background:#b44747}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.muted{color:#718695;font-size:13px}.item{border-top:1px solid #e8eff2;padding:12px 0}.item:first-child{border-top:0}.pill{display:inline-block;border-radius:20px;background:#e1f5f2;color:#006d70;padding:4px 9px;font-size:12px}.big{font-size:42px;font-weight:750;font-variant-numeric:tabular-nums;text-align:center;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f1f6f8;border-radius:12px;padding:14px}.metric b{display:block;font-size:25px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #d7e3e8;z-index:10;padding-bottom:env(safe-area-inset-bottom)}nav button{background:white;color:#6b8190;border-radius:0;flex:1;padding:10px 2px;font-size:11px}nav button.active{color:#007c82;background:#e8f6f4}nav span{display:block;font-size:22px}.hidden{display:none!important}.step{padding:10px;border:1px solid #dbe6e9;border-radius:10px;margin:8px 0}.alert{background:#fff2d8;padding:12px;border-radius:12px;font-size:13px}a{color:#087f85}.empty{padding:16px;color:#718695;text-align:center}details{border-top:1px solid #e3eaee;padding:12px 0}summary{font-weight:650;cursor:pointer}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}#toast{position:fixed;bottom:90px;left:15px;right:15px;background:#183c4b;color:white;padding:12px;border-radius:12px;display:none;z-index:20}@media(min-width:700px){main{padding:22px 22px 110px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><strong>Hospitality <span style="color:#5bdbca">OS</span></strong><small>Operations · Assessment · Delivery</small></header><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
'use strict';
const MODULES={
'Espacios y capacidad':[['Superficie útil','m²'],['Mesas interiores','ud'],['Asientos en barra','ud'],['Mesas terraza','ud'],['Aforo','personas'],['Distancia recorrida','m'],['Ocupación','%']],
'Experiencia y servicio':[['Espera para sentarse','s'],['Primera atención','s'],['Tiempo hasta comanda','s'],['Entrega de bebida','s'],['Entrega de platos','s'],['Pago','s'],['Rotación de mesas','veces'],['Satisfacción','/10']],
'Producción y cocina':[['Mise en place','s'],['Espera cocina','s'],['Preparación activa','s'],['Cocción','s'],['Emplatado','s'],['Espera en pase','s'],['Entrega a mesa','s'],['Errores','ud']],
'Personal y productividad':[['Horas trabajadas','h'],['Horas planificadas','h'],['Coste laboral','€'],['Ventas netas','€'],['Pedidos atendidos','ud'],['Absentismo','%']],
'Producto y costes':[['Coste ingredientes','€'],['Precio de venta','€'],['Merma','%'],['Unidades vendidas','ud'],['Tiempo elaboración','s'],['Coste envase','€']],
'Delivery y take-away':[['Tiempo aceptación','s'],['Tiempo preparación','s'],['Tiempo empaquetado','s'],['Espera repartidor','s'],['Tiempo entrega','s'],['Comisión','€'],['Pedidos cancelados','ud']],
'Calidad y seguridad alimentaria':[['Temperatura','°C'],['Controles realizados','ud'],['No conformidades','ud'],['Acciones correctivas abiertas','ud'],['Incidencias','ud']],
'Energía y sostenibilidad':[['Electricidad','kWh'],['Agua','m³'],['Gas','kWh'],['Residuos','kg'],['Desperdicio alimentario','kg'],['Coste energético','€']]
};
const DB='hospitality-os-v1';let db,tab='inicio',timer=null,timerInterval=null,recording=null,recordChunks=[],audioStream=null;
const uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeNames=['sites','assessments','observations','studies','notes','files','projects','tasks','timeEntries','settings'];
function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>storeNames.forEach(n=>{if(!q.result.objectStoreNames.contains(n))q.result.createObjectStore(n,{keyPath:'id'})});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function tx(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function all(name){return new Promise((res,rej)=>{let q=tx(name).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function get(name,id){return new Promise((res,rej)=>{let q=tx(name).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function put(name,obj){return new Promise((res,rej)=>{let q=tx(name,'readwrite').put(obj);q.onsuccess=()=>res(obj);q.onerror=()=>rej(q.error)})}
function del(name,id){return new Promise((res,rej)=>{let q=tx(name,'readwrite').delete(id);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500)}
const app=()=>document.getElementById('app');
const field=(id,label,type='text',extra='')=>'<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+extra+'>';
const select=(id,label,items)=>'<label for="'+id+'">'+label+'</label><select id="'+id+'">'+items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select>';
const val=id=>document.getElementById(id)?.value??'';
function renderNav(){document.getElementById('nav').innerHTML=[['inicio','⌂','Inicio'],['captura','⊕','Capturar'],['assess','▤','Evaluar'],['proyectos','☷','Proyectos'],['mas','⚙','Más']].map(([id,icon,label])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')"><span>'+icon+'</span>'+label+'</button>').join('')}
async function go(t){tab=t;renderNav();if(t==='inicio')await home();if(t==='captura')await capture();if(t==='assess')await assessments();if(t==='proyectos')await projects();if(t==='mas')await more();window.scrollTo(0,0)}
async function siteOptions(){return (await all('sites')).map(x=>({id:x.id,name:x.name}))}
async function home(){let sites=await all('sites'),obs=await all('observations'),tasks=await all('tasks'),studies=await all('studies');app().innerHTML='<h2>Panel de operaciones</h2><div class="grid"><div class="metric"><small>Locales</small><b>'+sites.length+'</b></div><div class="metric"><small>Mediciones</small><b>'+obs.length+'</b></div><div class="metric"><small>Estudios</small><b>'+studies.length+'</b></div><div class="metric"><small>Tareas abiertas</small><b>'+tasks.filter(x=>!x.done).length+'</b></div></div><div class="card"><h3>Captura en el terreno</h3><p>Cronometra un proceso, dicta una nota o adjunta evidencia sin salir de la aplicación.</p><div class="actions"><button onclick="go(\'captura\')">Empezar captura</button><button class="secondary" onclick="go(\'assess\')">Assessment</button></div></div><div class="card"><h3>Establecimientos</h3>'+ (sites.map(s=>'<div class="item"><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.type||'Sin tipo')+' · '+esc(s.area||'—')+' m²</div></div>').join('')||'<div class="empty">Crea tu primer establecimiento en Más.</div>')+'</div><div class="alert">Tus datos se guardan únicamente en este navegador. No hay sincronización entre dispositivos ni copia automática en la nube.</div>'}
async function capture(){let sites=await siteOptions();let opts=[{id:'',name:'Sin asignar'},...sites];app().innerHTML='<h2>Captura rápida</h2><div class="card"><h3>⏱ Estudio de tiempos</h3>'+select('timersite','Establecimiento',opts)+field('timername','Proceso / plato / operación')+field('segment','Etapa actual (ej. preparación)')+'<div id="clock" class="big">00:00.0</div><div class="actions"><button id="startBtn" onclick="startTimer()">Iniciar / reanudar</button><button class="secondary" onclick="pauseTimer()">Pausar</button><button class="secondary" onclick="lapTimer()">Marcar etapa</button><button class="danger" onclick="finishTimer()">Guardar estudio</button></div><div id="laps"></div></div><div class="card"><h3>🎙 Nota de voz</h3><p>Graba audio en el móvil. La transcripción depende del reconocimiento de voz disponible en el navegador; si no está disponible, conserva la grabación.</p><div class="actions"><button onclick="startAudio()">Grabar audio</button><button class="danger" onclick="stopAudio()">Detener y guardar</button><button class="secondary" onclick="dictate()">Dictar texto</button></div><textarea id="noteText" placeholder="Escribe o dicta tu observación..."></textarea><button onclick="saveNote()">Guardar nota</button><div id="audioStatus" class="muted"></div></div><div class="card"><h3>📷 Fotos y documentos</h3><p>Fotografía o selecciona un archivo. Se guarda localmente y puedes intentar extraer texto de imágenes.</p><input id="fileInput" type="file" accept="image/*,.pdf,.txt" capture="environment"><div class="actions"><button onclick="saveFile()">Guardar archivo</button><button class="secondary" onclick="ocrFile()">Extraer texto de imagen</button></div><div id="ocrStatus" class="muted"></div></div>';if(timer)updateTimerUI()}
function elapsed(){return timer?timer.elapsed+(timer.running?Date.now()-timer.started:0):0}
function fmt(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+Math.floor(ms%1000/100)}
function persistTimer(){if(timer)localStorage.setItem('hos-timer',JSON.stringify(timer));else localStorage.removeItem('hos-timer')}
function updateTimerUI(){let e=document.getElementById('clock');if(e)e.textContent=fmt(elapsed());let l=document.getElementById('laps');if(l&&timer)l.innerHTML=timer.laps.map((x,i)=>'<div class="step">'+(i+1)+'. '+esc(x.name)+' — '+fmt(x.duration)+'</div>').join('')}
function startTimer(){if(!timer)timer={id:uid(),name:val('timername')||'Estudio sin nombre',siteId:val('timersite'),startedAt:now(),elapsed:0,started:Date.now(),running:true,laps:[],lastMark:0};else if(!timer.running){timer.started=Date.now();timer.running=true}persistTimer();updateTimerUI();toast('Cronómetro activo')}
function pauseTimer(){if(!timer||!timer.running)return;timer.elapsed=elapsed();timer.running=false;persistTimer();updateTimerUI()}
function lapTimer(){if(!timer)return;let e=elapsed(),name=val('segment')||'Etapa '+(timer.laps.length+1);timer.laps.push({name,duration:e-timer.lastMark,at:now()});timer.lastMark=e;persistTimer();updateTimerUI();let el=document.getElementById('segment');if(el)el.value=''}
async function finishTimer(){if(!timer)return;pauseTimer();let t={...timer,duration:elapsed(),finishedAt:now()};await put('studies',t);await put('observations',{id:uid(),siteId:t.siteId,module:'Producción y cocina',metric:'Tiempo de ciclo',unit:'s',value:Math.round(t.duration/1000*10)/10,at:now(),source:'cronómetro',studyId:t.id});timer=null;persistTimer();toast('Estudio guardado');await capture()}
async function startAudio(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Grabación no disponible en este navegador');return}try{audioStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recording=new MediaRecorder(audioStream);recording.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recording.onstop=async()=>{let blob=new Blob(recordChunks,{type:recording.mimeType});await put('files',{id:uid(),name:'Nota de voz '+new Date().toLocaleString('es-ES'),type:blob.type,blob,at:now()});audioStream.getTracks().forEach(x=>x.stop());toast('Audio guardado en este dispositivo')};recording.start();document.getElementById('audioStatus').textContent='Grabando...'}catch(e){toast('No se pudo acceder al micrófono')}}
function stopAudio(){if(recording?.state==='recording'){recording.stop();document.getElementById('audioStatus').textContent='Audio guardado'}}
function dictate(){let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Este navegador no ofrece dictado compatible');return}let r=new Speech();r.lang='es-ES';r.continuous=true;r.interimResults=false;r.onresult=e=>{let s=Array.from(e.results).map(x=>x[0].transcript).join(' ');document.getElementById('noteText').value+=' '+s};r.onerror=e=>toast('Dictado: '+e.error);r.start();toast('Dictado activo; usa el micrófono del navegador')}
async function saveNote(){let text=val('noteText').trim();if(!text)return toast('Escribe o dicta una nota');await put('notes',{id:uid(),text,at:now(),source:'manual/dictado'});document.getElementById('noteText').value='';toast('Nota guardada')}
async function saveFile(){let f=document.getElementById('fileInput')?.files?.[0];if(!f)return toast('Selecciona un archivo');if(f.size>15*1024*1024)return toast('Máximo 15 MB por archivo');await put('files',{id:uid(),name:f.name,type:f.type,blob:f,at:now()});toast('Archivo guardado localmente')}
async function ocrFile(){let f=document.getElementById('fileInput')?.files?.[0],s=document.getElementById('ocrStatus');if(!f||!f.type.startsWith('image/'))return toast('Selecciona una imagen');s.textContent='Cargando motor OCR. Requiere conexión a Internet...';try{if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');let r=await Tesseract.recognize(f,'spa+eng');s.textContent='Texto extraído (revisar antes de guardar):';document.getElementById('noteText').value+='\n'+r.data.text;toast('OCR completado; revisa el texto y guarda la nota')}catch(e){s.textContent='OCR no disponible. El archivo puede guardarse igualmente.'}}
function loadScript(url){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.append(s)})}
async function assessments(){let sites=await siteOptions(),ass=await all('assessments'),obs=await all('observations');app().innerHTML='<h2>Assessments</h2><div class="card"><h3>Nuevo assessment</h3>'+select('asite','Establecimiento',sites.length?sites:[{id:'',name:'Crea antes un establecimiento'}])+field('aname','Nombre','text','placeholder="Diagnóstico inicial"')+'<button onclick="newAssessment()" '+(!sites.length?'disabled':'')+'>Crear assessment</button></div>'+ass.map(a=>'<div class="card"><h3>'+esc(a.name)+'</h3><span class="muted">'+new Date(a.at).toLocaleDateString('es-ES')+'</span><p>'+obs.filter(o=>o.assessmentId===a.id).length+' mediciones registradas</p><button onclick="editAssessment(\''+a.id+'\')">Abrir y medir</button></div>').join('')}
async function newAssessment(){if(!val('asite'))return;let a={id:uid(),name:val('aname')||'Assessment',siteId:val('asite'),at:now()};await put('assessments',a);await editAssessment(a.id)}
async function editAssessment(id){let a=await get('assessments',id),obs=await all('observations'),settings=await all('settings'),custom=settings.filter(x=>x.kind==='metric');app().innerHTML='<button class="secondary" onclick="go(\'assess\')">← Volver</button><h2>'+esc(a.name)+'</h2><p>Todos los campos son opcionales. Registra solo lo que necesites.</p>'+Object.entries(MODULES).map(([module,fields])=>'<div class="card"><details><summary>'+esc(module)+'</summary>'+select('metric-'+slug(module),'Indicador',[...fields.map(x=>({id:x[0]+'|'+x[1],name:x[0]+' ('+x[1]+')'})),...custom.filter(x=>x.module===module).map(x=>({id:x.name+'|'+x.unit,name:x.name+' ('+x.unit+')'}))])+field('value-'+slug(module),'Valor','number','step="any"')+field('comment-'+slug(module),'Contexto / comentario')+'<button onclick="saveObservation(\''+id+'\',\''+esc(slug(module))+'\',\''+esc(module)+'\')">Guardar medición</button><div class="muted">'+obs.filter(x=>x.assessmentId===id&&x.module===module).length+' registros</div></details></div>').join('')+'<div class="card"><h3>Últimas mediciones</h3>'+obs.filter(x=>x.assessmentId===id).slice(-15).reverse().map(x=>'<div class="item"><b>'+esc(x.metric)+'</b> '+esc(x.value)+' '+esc(x.unit)+'<div class="muted">'+esc(x.module)+'</div></div>').join('')+'</div>'}
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'_');
async function saveObservation(id,key,module){let raw=val('metric-'+key).split('|'),value=val('value-'+key);if(value==='')return toast('Introduce un valor');let a=await get('assessments',id);await put('observations',{id:uid(),assessmentId:id,siteId:a.siteId,module,metric:raw[0],unit:raw[1],value:Number(value),comment:val('comment-'+key),at:now(),source:'manual'});toast('Medición guardada');await editAssessment(id)}
async function projects(){let ps=await all('projects'),tasks=await all('tasks'),entries=await all('timeEntries');app().innerHTML='<h2>Proyectos y tareas</h2><div class="card"><h3>Nuevo proyecto</h3>'+field('pname','Nombre del proyecto')+'<button onclick="newProject()">Crear</button></div>'+ps.map(p=>'<div class="card"><h3>'+esc(p.name)+'</h3><div class="muted">'+tasks.filter(x=>x.projectId===p.id).length+' tareas · '+(entries.filter(x=>x.projectId===p.id).reduce((s,x)=>s+Number(x.hours),0)).toFixed(1)+' h registradas</div>'+field('task-'+p.id,'Nueva tarea')+'<button onclick="newTask(\''+p.id+'\')">Añadir tarea</button>'+tasks.filter(x=>x.projectId===p.id).map(t=>'<div class="item check"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask(\''+t.id+'\',this.checked)"><span>'+esc(t.name)+'</span></div>').join('')+field('hours-'+p.id,'Horas de consultoría','number','step="0.25" min="0"')+field('hoursnote-'+p.id,'Descripción')+'<button class="secondary" onclick="saveHours(\''+p.id+'\')">Registrar horas</button></div>').join('')}
async function newProject(){if(!val('pname').trim())return;await put('projects',{id:uid(),name:val('pname').trim(),at:now()});await projects()}
async function newTask(id){let name=val('task-'+id).trim();if(!name)return;await put('tasks',{id:uid(),projectId:id,name,done:false,at:now()});await projects()}
async function toggleTask(id,done){let t=await get('tasks',id);t.done=done;await put('tasks',t)}
async function saveHours(id){let h=Number(val('hours-'+id));if(!(h>0))return toast('Introduce horas válidas');await put('timeEntries',{id:uid(),projectId:id,hours:h,note:val('hoursnote-'+id),at:now()});toast('Horas registradas');await projects()}
async function more(){let sites=await all('sites'),notes=await all('notes'),files=await all('files'),studies=await all('studies');app().innerHTML='<h2>Administración</h2><div class="card"><h3>Nuevo establecimiento</h3>'+field('sname','Nombre')+select('stype','Tipo',['Restaurante','Cafetería','QSR','Hotel','Colectividades','Dark kitchen','Otro'].map(x=>({id:x,name:x})))+field('sarea','Superficie útil (m²)','number','step="any"')+field('stables','Mesas','number')+field('sbar','Asientos en barra','number')+field('sterrace','Mesas terraza','number')+'<button onclick="newSite()">Guardar establecimiento</button></div><div class="card"><h3>Indicadores personalizados</h3>'+select('cmodule','Módulo',Object.keys(MODULES).map(x=>({id:x,name:x})))+field('cname','Nombre del indicador')+field('cunit','Unidad (s, €, %, m²...)')+'<button onclick="newMetric()">Añadir indicador</button></div><div class="card"><h3>Notas recientes</h3>'+ (notes.slice(-10).reverse().map(x=>'<div class="item">'+esc(x.text)+'<div class="muted">'+new Date(x.at).toLocaleString('es-ES')+'</div></div>').join('')||'<p>Sin notas</p>')+'</div><div class="card"><h3>Estudios guardados</h3>'+studies.slice(-10).reverse().map(x=>'<div class="item"><b>'+esc(x.name)+'</b> · '+fmt(x.duration)+'<div class="muted">'+x.laps.length+' etapas</div></div>').join('')+'</div><div class="card"><h3>Archivos locales</h3>'+files.slice(-15).reverse().map(x=>'<div class="item">'+esc(x.name)+' <button class="secondary" onclick="downloadFile(\''+x.id+'\')">Abrir / descargar</button></div>').join('')+'</div><div class="card"><h3>Copias de seguridad</h3><p>Exporta los registros estructurados a JSON. Los archivos multimedia no se incluyen en esta copia.</p><div class="actions"><button onclick="backup()">Exportar datos</button><button class="secondary" onclick="document.getElementById(\'importBackup\').click()">Importar copia</button></div><input id="importBackup" type="file" accept=".json,application/json" onchange="restore(event)" style="display:none"></div><div class="alert">Versión local sin cuentas, backend ni sincronización. OCR de imágenes mediante librería externa descargada bajo demanda; dictado depende del navegador y puede utilizar servicios de terceros. No subas datos sensibles sin revisar esas condiciones.</div>'}
async function newSite(){let name=val('sname').trim();if(!name)return toast('Introduce el nombre');await put('sites',{id:uid(),name,type:val('stype'),area:val('sarea'),tables:val('stables'),bar:val('sbar'),terrace:val('sterrace'),at:now()});toast('Establecimiento creado');await more()}
async function newMetric(){let name=val('cname').trim();if(!name)return;await put('settings',{id:uid(),kind:'metric',module:val('cmodule'),name,unit:val('cunit')});toast('Indicador añadido');await more()}
async function downloadFile(id){let x=await get('files',id);if(!x)return;let u=URL.createObjectURL(x.blob),a=document.createElement('a');a.href=u;a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function downloadJSON(data,name){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function backup(){let out={format:'hospitality-os-backup-v1',at:now(),data:{}};for(let n of storeNames.filter(x=>x!=='files'))out.data[n]=await all(n);downloadJSON(out,'hospitality-os-'+new Date().toISOString().slice(0,10)+'.json')}
async function restore(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.format!=='hospitality-os-backup-v1')throw Error('Formato incompatible');if(!confirm('Importar registros de esta copia? Se añadirán o actualizarán los IDs existentes.'))return;for(let [n,rows] of Object.entries(data.data)){if(!storeNames.includes(n)||!Array.isArray(rows))continue;for(let x of rows)if(x.id)await put(n,x)}toast('Copia importada');await go('inicio')}catch(err){toast('No se pudo importar: '+err.message)}}
(async()=>{try{db=await openDB();let saved=localStorage.getItem('hos-timer');if(saved)timer=JSON.parse(saved);timerInterval=setInterval(updateTimerUI,100);await go('inicio')}catch(e){app().innerHTML='<div class="card"><h2>Error de almacenamiento</h2><p>Este navegador no permite IndexedDB. Abre la aplicación fuera del modo privado.</p></div>'}})();
</script>
<style>
.tag{font-size:11px;background:#e8f5f2;color:#006c70;border-radius:7px;padding:5px 8px;display:inline-block}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap}.kpi-row .tag{background:#eaf0f6;color:#26455a}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button{flex:1}
input[type=checkbox]{min-width:20px;min-height:20px}
</style>
<script>
/* Hospitality OS 0.2: local-first consulting workflow extension. */
const extraStores=['findings','contacts','caseActions'];
let extraDB;
function extraOpen(){return new Promise((res,rej)=>{let r=indexedDB.open('hospitality-os-extension-v2',1);r.onupgradeneeded=()=>extraStores.forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>{extraDB=r.result;res()};r.onerror=()=>rej(r.error)})}
const extraReady=extraOpen().catch(()=>toast('Almacenamiento de casos no disponible'));
function exStore(n,mode='readonly'){return extraDB.transaction(n,mode).objectStore(n)}
async function exAll(n){await extraReady;if(!extraDB)return[];return new Promise((res,rej)=>{let r=exStore(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function exPut(n,x){await extraReady;if(!extraDB)throw Error('Almacenamiento no disponible');return new Promise((res,rej)=>{let r=exStore(n,'readwrite').put(x);r.onsuccess=()=>res(x);r.onerror=()=>rej(r.error)})}
function escapeCSV(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function csvDownload(rows,name){if(!rows.length)return toast('No hay datos para exportar');let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let lines=[keys.map(escapeCSV).join(';'),...rows.map(x=>keys.map(k=>escapeCSV(typeof x[k]==='object'?JSON.stringify(x[k]):x[k])).join(';'))];let u=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function exportMeasurements(){csvDownload(await all('observations'),'hospitality-mediciones.csv')}
async function exportTimeStudies(){let rows=(await all('studies')).flatMap(x=>x.laps.length?x.laps.map((l,i)=>({estudio:x.name,fecha:x.startedAt,etapa:i+1,nombre:l.name,duracion_segundos:(l.duration/1000).toFixed(2),total_segundos:(x.duration/1000).toFixed(2),establecimiento:x.siteId})): [{estudio:x.name,fecha:x.startedAt,etapa:'',nombre:'',duracion_segundos:'',total_segundos:(x.duration/1000).toFixed(2),establecimiento:x.siteId}]);csvDownload(rows,'hospitality-tiempos.csv')}
function num(n){return new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(n)}
function stats(xs){let a=xs.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;return {n:a.length,mean:a.reduce((s,x)=>s+x,0)/a.length,median:a[Math.floor((a.length-1)*.5)],p90:a[Math.ceil(a.length*.9)-1],min:a[0],max:a[a.length-1]}}
async function studyInsights(){let studies=await all('studies'),obs=await all('observations'),groups={};studies.forEach(s=>{let key=s.name||'Sin nombre';(groups[key]??=[]).push(s.duration/1000)});let entries=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);app().innerHTML='<button class="secondary" onclick="go(\'mas\')">← Volver</button><h2>Estudios de tiempos</h2><p>Comparativas basadas en estudios reales guardados en este dispositivo. Los P90 son aproximaciones por rango observado.</p><div class="toolbar"><button onclick="exportTimeStudies()">Exportar estudios CSV</button><button class="secondary" onclick="exportMeasurements()">Exportar mediciones CSV</button></div>'+ (entries.map(([name,values])=>{let s=stats(values);return '<div class="card"><h3>'+esc(name)+'</h3><div class="kpi-row"><span class="tag">'+s.n+' observaciones</span><span class="tag">Media '+num(s.mean)+' s</span><span class="tag">Mediana '+num(s.median)+' s</span><span class="tag">P90 '+num(s.p90)+' s</span></div><p class="muted">Mínimo '+num(s.min)+' s · Máximo '+num(s.max)+' s</p><button class="secondary" onclick="newFindingFromStudy(\''+encodeURIComponent(name)+'\')">Crear hallazgo</button></div>'}).join('')||'<div class="card empty">Todavía no hay estudios guardados. Empieza desde Capturar.</div>')}
async function newFindingFromStudy(encoded){await findingForm(decodeURIComponent(encoded))}
async function findingForm(defaultTitle=''){let sites=await siteOptions(),projectsList=await all('projects');app().innerHTML='<button class="secondary" onclick="cases()">← Casos</button><h2>Nuevo hallazgo</h2><div class="card"><p>Documenta una oportunidad de mejora, su evidencia y el impacto esperado. Después podrás convertirla en tarea.</p>'+field('fTitle','Título del hallazgo','text','value="'+esc(defaultTitle)+'"')+select('fSite','Establecimiento',[{id:'',name:'Sin asignar'},...sites])+select('fCategory','Área',Object.keys(MODULES).map(x=>({id:x,name:x})))+select('fPriority','Prioridad',['Alta','Media','Baja'].map(x=>({id:x,name:x})))+select('fStatus','Estado',['Identificado','En análisis','En ejecución','Validado','Descartado'].map(x=>({id:x,name:x})))+'<label for="fEvidence">Observación y evidencia</label><textarea id="fEvidence" placeholder="Qué has visto, cuándo, con qué datos..."></textarea>'+field('fImpact','Ahorro potencial estimado €/mes (opcional)','number','step="any"')+select('fProject','Proyecto relacionado',[{id:'',name:'Sin asignar'},...projectsList.map(x=>({id:x.id,name:x.name}))])+'<button onclick="saveFinding()">Guardar hallazgo</button></div>'}
async function saveFinding(){let title=val('fTitle').trim();if(!title)return toast('Introduce un título');let amount=val('fImpact');await exPut('findings',{id:uid(),title,siteId:val('fSite'),category:val('fCategory'),priority:val('fPriority'),status:val('fStatus'),evidence:val('fEvidence'),impact:amount===''?null:Number(amount),projectId:val('fProject'),at:now()});toast('Hallazgo guardado');await cases()}
async function cases(){let findings=await exAll('findings'),sites=await all('sites'),projectsList=await all('projects');let byId=Object.fromEntries(sites.map(s=>[s.id,s.name]));app().innerHTML='<h2>Casos de optimización</h2><p>Del diagnóstico a la ejecución. Los impactos son estimaciones hasta su validación.</p><div class="toolbar"><button onclick="findingForm()">+ Nuevo hallazgo</button><button class="secondary" onclick="exportFindings()">Exportar CSV</button></div>'+ (findings.slice().reverse().map(f=>'<div class="card"><div class="kpi-row"><span class="tag">'+esc(f.priority)+'</span><span class="tag">'+esc(f.status)+'</span></div><h3>'+esc(f.title)+'</h3><div class="muted">'+esc(byId[f.siteId]||'Sin establecimiento')+' · '+esc(f.category)+'</div><p>'+esc(f.evidence||'Sin observaciones')+'</p>'+(f.impact!==null?'<p><b>'+num(f.impact)+' €/mes</b> · estimación no validada</p>':'')+(f.projectId?'<span class="tag">Proyecto vinculado</span>':'<span class="muted">Sin proyecto</span>')+'<div class="actions"><button onclick="createTaskFromFinding(\''+f.id+'\')">Crear tarea</button><button class="secondary" onclick="changeFindingStatus(\''+f.id+'\')">Cambiar estado</button></div></div>').join('')||'<div class="card empty">Sin hallazgos. Registra uno tras una observación o estudio de tiempos.</div>')}
async function exportFindings(){csvDownload(await exAll('findings'),'hospitality-hallazgos.csv')}
async function changeFindingStatus(id){let f=(await exAll('findings')).find(x=>x.id===id);if(!f)return;let statuses=['Identificado','En análisis','En ejecución','Validado','Descartado'];let next=prompt('Nuevo estado:\n'+statuses.join(' / '),f.status);if(!next)return;if(!statuses.includes(next))return toast('Estado no válido');f.status=next;f.updatedAt=now();await exPut('findings',f);await cases()}
async function createTaskFromFinding(id){let f=(await exAll('findings')).find(x=>x.id===id);if(!f)return;let projectId=f.projectId,ps=await all('projects');if(!projectId){if(!ps.length){let p={id:uid(),name:'Plan de optimización',at:now()};await put('projects',p);projectId=p.id}else{let names=ps.map((p,i)=>(i+1)+'. '+p.name).join('\n');let choice=prompt('Elige el número de proyecto:\n'+names,'1');if(!choice)return;let p=ps[Number(choice)-1];if(!p)return toast('Proyecto no válido');projectId=p.id}f.projectId=projectId;await exPut('findings',f)}await put('tasks',{id:uid(),projectId,name:'Optimizar: '+f.title,done:false,at:now(),findingId:id});toast('Tarea creada en proyecto');await cases()}
const originalMore=more;
more=async function(){await originalMore();let section=document.createElement('div');section.className='card';section.innerHTML='<h3>Consultoría y análisis</h3><div class="actions"><button onclick="cases()">Casos de optimización</button><button class="secondary" onclick="studyInsights()">Estadísticas de tiempos</button></div><p class="muted">Incluye hallazgos, estimación de impacto, conversión a tareas y exportación de datos.</p>';app().prepend(section)};
const originalHome=home;
home=async function(){await originalHome();let findings=await exAll('findings');let section=document.createElement('div');section.className='card';section.innerHTML='<h3>Oportunidades de mejora</h3><div class="grid"><div class="metric"><small>Hallazgos</small><b>'+findings.length+'</b></div><div class="metric"><small>En ejecución</small><b>'+findings.filter(x=>x.status==='En ejecución').length+'</b></div></div><div class="actions"><button onclick="cases()">Abrir casos</button><button class="secondary" onclick="studyInsights()">Analizar tiempos</button></div>';let cards=app().querySelectorAll('.card');if(cards[0])cards[0].after(section);else app().append(section)};
const originalBackup=backup;
backup=async function(){let out={format:'hospitality-os-backup-v2',at:now(),data:{},extensions:{}};for(let n of storeNames.filter(x=>x!=='files'))out.data[n]=await all(n);for(let n of extraStores)out.extensions[n]=await exAll(n);downloadJSON(out,'hospitality-os-'+new Date().toISOString().slice(0,10)+'.json')};
restore=async function(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!['hospitality-os-backup-v1','hospitality-os-backup-v2'].includes(data.format))throw Error('Formato incompatible');if(!confirm('Importar registros de esta copia?'))return;for(let [n,rows] of Object.entries(data.data||{})){if(!storeNames.includes(n)||!Array.isArray(rows))continue;for(let x of rows)if(x.id)await put(n,x)}for(let [n,rows] of Object.entries(data.extensions||{})){if(!extraStores.includes(n)||!Array.isArray(rows))continue;for(let x of rows)if(x.id)await exPut(n,x)}toast('Copia importada');await go('inicio')}catch(err){toast('Error al importar: '+err.message)}};
</script></body></html>
